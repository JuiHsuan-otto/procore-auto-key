name: SEO and public-boundary validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static site release gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run SEO foundation and privacy gates
        run: npm run test:seo-foundation

      - name: Validate all static pages
        run: npm run validate:site

      - name: Audit measurement taxonomy
        run: npm run audit:measurement

      - name: Validate schema rollout
        run: npm run validate:schema-rollout

      - name: Validate publication contracts and closed-loop worker
        env:
          GIT_AUTHOR_NAME: CasePilot CI Fixture
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: CasePilot CI Fixture
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          npm run publication:verify-contract
          npm run publication:verify-action-contract
          npm run publication:verify-pr-receipt-contract
          npm run publication:verify-v2-contract
          npm run test:publication
          npm run test:publication-action
          npm run test:publication-pr
          npm run test:publication-v2

      - name: Check diff hygiene
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff-tree --check --root -r HEAD
          fi
